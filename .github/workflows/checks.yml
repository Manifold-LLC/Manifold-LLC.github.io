name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate@11 index.html capability-statement.html slick-sheet.html 404.html
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --root-dir ${{ github.workspace }} --offline --no-progress --exclude '\?v=[0-9a-f]+$' index.html capability-statement.html slick-sheet.html 404.html
          fail: true
      - name: Banned punctuation and words in site copy
        run: |
          ! grep -nP '—|–|&mdash;|&ndash;' index.html capability-statement.html slick-sheet.html 404.html
          ! grep -niE '\b(cutting-edge|full-spectrum|seamless|leverage|robust|holistic|comprehensive|mission-critical|best-in-class|innovative|empower|unlock|streamline|delve|testament|pivotal|crucial|showcase|boasts)\b' index.html capability-statement.html slick-sheet.html 404.html
      - name: Facts appear where expected
        run: |
          for f in index.html capability-statement.html slick-sheet.html 404.html; do grep -q 'info@manifold-llc.com' "$f" || { echo "email missing in $f"; exit 1; }; done
          for f in index.html capability-statement.html slick-sheet.html; do grep -q 'C6P2G6PQLEB8' "$f" && grep -q '23X60' "$f" || { echo "UEI or CAGE missing in $f"; exit 1; }; done
      - name: Asset links carry current content hashes
        run: |
          python3 scripts/stamp.py
          git diff --exit-code -- index.html capability-statement.html slick-sheet.html 404.html || { echo 'run python3 scripts/stamp.py and commit'; exit 1; }
          for f in assets/css/site.css assets/css/capability-statement.css assets/css/slick-sheet.css assets/js/site.js assets/js/manifold.js; do test -f "$f" || { echo "missing $f"; exit 1; }; done
      - name: security.txt expiry is more than 60 days out
        run: |
          exp=$(grep -i '^Expires:' .well-known/security.txt | cut -d' ' -f2)
          test "$(date -u -d "$exp" +%s)" -gt "$(date -u -d '+60 days' +%s)" || { echo "security.txt expires soon: $exp"; exit 1; }
      - name: Capability statement PDF is two pages
        run: test "$(grep -ac '/Count 2' manifold-capability-statement.pdf)" -ge 1
      - name: Overview PDF is one page
        run: test "$(grep -ac '/Count 1' manifold-overview.pdf)" -ge 1
