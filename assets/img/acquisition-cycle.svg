<text x="152.0" y="89.0" font-family="IBM Plex Sans, sans-serif" font-size="10.5" fill="#474b54">RFP and SOW language</text>
<polygon points="300.0,14.0 428.0,14.0 440.0,36.0 428.0,58.0 300.0,58.0 312.0,36.0" fill="#1e3a5f"/>
